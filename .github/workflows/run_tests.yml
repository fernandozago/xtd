name: Run tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    name: GCC 15 tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: gcc:15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update

          apt-get install -y --no-install-recommends \
            lcov \
            locales

          rm -rf /var/lib/apt/lists/*

          echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
          locale-gen en_US.UTF-8

      - name: Configure GCC 15 commands
        run: |
          if ! command -v g++-15 >/dev/null 2>&1; then
            ln -s "$(command -v g++)" /usr/local/bin/g++-15
          fi

          if ! command -v gcov-15 >/dev/null 2>&1; then
            ln -s "$(command -v gcov)" /usr/local/bin/gcov-15
          fi

          g++-15 --version
          gcov-15 --version
          lcov --version
          genhtml --version

      - name: Run tests and generate coverage
        env:
          CI: "true"
        run: |
          chmod +x ./tests/coverage.sh
          ./tests/coverage.sh

      - name: Verify test results
        if: always()
        run: |
          test -s tests/test-results/channels.xml
          test -s tests/test-results/pipelines.xml

          echo "Generated JUnit reports:"
          ls -lh tests/test-results
          find tests/test-results -maxdepth 1 -type f -name '*.xml' -print

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/test-results/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run benchmarks
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          chmod +x ./benchmarks/all.sh
          ./benchmarks/all.sh

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: tests/coverage/html

  test-report:
    name: Publish test results
    needs:
      - tests

    if: >-
      ${{
        always() &&
        needs.tests.result != 'cancelled' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Publish JUnit test results
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: C++ Tests
          path: '*.xml'
          reporter: java-junit
          report-title: C++ test results
          use-actions-summary: true
          list-suites: all
          list-tests: all
          fail-on-empty: true
          fail-on-error: true

  deploy:
    name: Deploy coverage report
    needs:
      - tests

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: true

    environment:
      name: Code Coverage
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy coverage report
        id: deployment
        uses: actions/deploy-pages@v5.0.0