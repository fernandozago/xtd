name: C++ Quality Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: gcc:15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install coverage dependencies
        run: |
          apt-get update

          apt-get install -y --no-install-recommends \
            lcov

          rm -rf /var/lib/apt/lists/*

      - name: Show compiler versions
        run: |
          g++ --version
          gcov --version
          lcov --version
          genhtml --version

      - name: Run tests and generate coverage
        env:
          CI: "true"
        run: |
          chmod +x ./build.sh
          ./build.sh tests +coverage

      - name: Verify test results
        if: always()
        run: |
          test -s tests/test-results/channels.xml
          test -s tests/test-results/pipelines.xml

          echo "Generated JUnit reports:"

          find tests/test-results \
            -maxdepth 1 \
            -type f \
            -name '*.xml' \
            -print

      - name: Verify coverage report
        if: always()
        run: |
          test -s tests/coverage/html/index.html

          echo "Generated coverage report:"
          ls -lh tests/coverage/html/index.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/test-results/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Package coverage report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: tests/coverage/html

  benchmarks:
    name: Benchmark Suite
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: gcc:15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install locale dependencies
        run: |
          apt-get update

          apt-get install -y --no-install-recommends \
            locales

          rm -rf /var/lib/apt/lists/*

          echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
          locale-gen en_US.UTF-8

      - name: Show compiler version
        run: |
          g++ --version

      - name: Run benchmark suite
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          chmod +x ./build.sh
          ./build.sh benchmarks

  publish-tests:
    name: Publish Test Results
    needs:
      - test-suite

    if: >-
      ${{
        always() &&
        needs.test-suite.result != 'cancelled' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Publish JUnit test results
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: C++ Tests
          path: '*.xml'
          reporter: java-junit
          report-title: C++ test results
          use-actions-summary: true
          list-suites: all
          list-tests: all
          fail-on-empty: true
          fail-on-error: true

  publish-coverage:
    name: Publish Coverage
    needs:
      - test-suite

    if: >-
      ${{
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        needs.test-suite.result == 'success'
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: true

    environment:
      name: Code Coverage
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy coverage report
        id: deployment
        uses: actions/deploy-pages@v5.0.0