services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest

    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s